name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --release -p control-plane -p edge-agent -p edge-proxy -p storm
      - name: package
        run: |
          mkdir -p dist
          for b in control-plane edge-agent edge-proxy storm; do
            cp target/release/$b dist/
          done
          cp benchmarks/storm-local.json dist/ 2>/dev/null || true
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/control-plane.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-control-plane:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/edge.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-edge:${{ github.ref_name }}
