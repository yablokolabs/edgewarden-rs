<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, ui-sans-serif, system-ui, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/><stop offset="1" stop-color="#16406e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123524"/><stop offset="1" stop-color="#1d5c3a"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b00"/><stop offset="1" stop-color="#6b4e00"/>
    </linearGradient>
    <style>
      .t-white { fill: #ffffff; } .t-dim { fill: #c7d2e0; } .t-dark { fill: #0b1526; }
      .title { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
      .sub { font-size: 14px; } .small { font-size: 12.5px; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { fill: rgba(255,255,255,.14); } .line { stroke: #7fb3ff; stroke-width: 2.5; } .line2 { stroke: #7ee2a8; stroke-width: 2.5; }
      .dash { stroke-dasharray: 7 6; } .box { rx: 14; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="760" fill="#0b1526"/>
  <text x="40" y="52" class="t-white title">EdgeWarden — Cloud-managed Rust edge proxy fleet</text>
  <text x="40" y="76" class="t-dim sub">Outbound gRPC/mTLS only · last-known-good dataplane · A/B OTA with rollback</text>

  <!-- Cloud -->
  <rect x="380" y="100" width="440" height="150" rx="14" fill="url(#cloud)" stroke="#7fb3ff" stroke-width="1.5"/>
  <text x="600" y="128" text-anchor="middle" class="t-white" font-size="16" font-weight="800">AWS / CLOUD — CONTROL PLANE</text>
  <text x="600" y="150" text-anchor="middle" class="t-dim small">Device / Fleet Registry · Desired State · Rollout Manager</text>
  <rect x="410" y="162" width="180" height="30" rx="15" class="chip"/><text x="500" y="182" text-anchor="middle" class="t-white small mono">gRPC :50051</text>
  <rect x="610" y="162" width="180" height="30" rx="15" class="chip"/><text x="700" y="182" text-anchor="middle" class="t-white small mono">REST :8080 · /devices</text>
  <text x="600" y="218" text-anchor="middle" class="t-dim small">desired_policy_version · desired_seq · health gates · Prometheus</text>

  <!-- gRPC backbone -->
  <line x1="600" y1="250" x2="600" y2="300" class="line"/>
  <rect x="520" y="258" width="160" height="26" rx="13" fill="#10294d" stroke="#7fb3ff"/><text x="600" y="276" text-anchor="middle" class="t-white small mono">gRPC + mTLS</text>
  <line x1="200" y1="300" x2="1000" y2="300" class="line"/>
  <line x1="200" y1="300" x2="200" y2="330" class="line"/><line x1="600" y1="300" x2="600" y2="330" class="line"/><line x1="1000" y1="300" x2="1000" y2="330" class="line"/>
  <text x="760" y="294" class="t-dim small">outbound persistent connection · jittered backoff · at-least-once + idempotent</text>

  <!-- Edges -->
  <g>
    <rect x="60" y="330" width="280" height="330" rx="14" fill="url(#edge)" stroke="#7ee2a8" stroke-width="1.5"/>
    <text x="200" y="358" text-anchor="middle" class="t-white" font-size="17" font-weight="800">Edge-01</text>
    <rect x="80" y="370" width="240" height="66" rx="10" fill="rgba(0,0,0,.35)" stroke="#7ee2a8"/><text x="200" y="390" text-anchor="middle" class="t-white small" font-weight="700">Edge Agent (Tokio)</text><text x="200" y="410" text-anchor="middle" class="t-dim small">desired ⇄ reported · StateStore</text><text x="200" y="426" text-anchor="middle" class="t-dim small mono">edge-state.json</text>
    <rect x="80" y="444" width="240" height="66" rx="10" fill="url(#plane)" stroke="#ffd166"/><text x="200" y="464" text-anchor="middle" class="t-white small" font-weight="700">Rust TCP Proxy</text><text x="200" y="484" text-anchor="middle" class="t-dim small">copy_bidirectional · backpressure</text><text x="200" y="500" text-anchor="middle" class="t-dim small">bounded · timeouts</text>
    <rect x="80" y="518" width="240" height="56" rx="10" fill="rgba(0,0,0,.35)" stroke="#8ecae6"/><text x="200" y="538" text-anchor="middle" class="t-white small" font-weight="700">OTA A/B · Health · Metrics</text><text x="200" y="556" text-anchor="middle" class="t-dim small">rollback · watchdog · /metrics</text>
    <text x="200" y="600" text-anchor="middle" class="t-dim small">Linux Net · TPROXY opt-in</text>
    <text x="200" y="624" text-anchor="middle" class="line2 mono small">LAN ─► PROXY ─► WAN</text>
  </g>
  <g>
    <rect x="460" y="330" width="280" height="330" rx="14" fill="url(#edge)" stroke="#7ee2a8" stroke-width="1.5"/>
    <text x="600" y="358" text-anchor="middle" class="t-white" font-size="17" font-weight="800">Edge-02</text>
    <rect x="480" y="370" width="240" height="66" rx="10" fill="rgba(0,0,0,.35)" stroke="#7ee2a8"/><text x="600" y="390" text-anchor="middle" class="t-white small" font-weight="700">Edge Agent (Tokio)</text><text x="600" y="410" text-anchor="middle" class="t-dim small">desired ⇄ reported · StateStore</text><text x="600" y="426" text-anchor="middle" class="t-dim small mono">edge-state.json</text>
    <rect x="480" y="444" width="240" height="66" rx="10" fill="url(#plane)" stroke="#ffd166"/><text x="600" y="464" text-anchor="middle" class="t-white small" font-weight="700">Rust TCP Proxy</text><text x="600" y="484" text-anchor="middle" class="t-dim small">copy_bidirectional · backpressure</text><text x="600" y="500" text-anchor="middle" class="t-dim small">bounded · timeouts</text>
    <rect x="480" y="518" width="240" height="56" rx="10" fill="rgba(0,0,0,.35)" stroke="#8ecae6"/><text x="600" y="538" text-anchor="middle" class="t-white small" font-weight="700">OTA A/B · Health · Metrics</text><text x="600" y="556" text-anchor="middle" class="t-dim small">rollback · watchdog · /metrics</text>
    <text x="600" y="600" text-anchor="middle" class="t-dim small">Linux Net · TPROXY opt-in</text>
    <text x="600" y="624" text-anchor="middle" class="line2 mono small">LAN ─► PROXY ─► WAN</text>
  </g>
  <g>
    <rect x="860" y="330" width="280" height="330" rx="14" fill="url(#edge)" stroke="#7ee2a8" stroke-width="1.5"/>
    <text x="1000" y="358" text-anchor="middle" class="t-white" font-size="17" font-weight="800">Edge-N</text>
    <rect x="880" y="370" width="240" height="66" rx="10" fill="rgba(0,0,0,.35)" stroke="#7ee2a8"/><text x="1000" y="390" text-anchor="middle" class="t-white small" font-weight="700">Edge Agent (Tokio)</text><text x="1000" y="410" text-anchor="middle" class="t-dim small">desired ⇄ reported · StateStore</text><text x="1000" y="426" text-anchor="middle" class="t-dim small mono">edge-state.json</text>
    <rect x="880" y="444" width="240" height="66" rx="10" fill="url(#plane)" stroke="#ffd166"/><text x="1000" y="464" text-anchor="middle" class="t-white small" font-weight="700">Rust TCP Proxy</text><text x="1000" y="484" text-anchor="middle" class="t-dim small">copy_bidirectional · backpressure</text><text x="1000" y="500" text-anchor="middle" class="t-dim small">bounded · timeouts</text>
    <rect x="880" y="518" width="240" height="56" rx="10" fill="rgba(0,0,0,.35)" stroke="#8ecae6"/><text x="1000" y="538" text-anchor="middle" class="t-white small" font-weight="700">OTA A/B · Health · Metrics</text><text x="1000" y="556" text-anchor="middle" class="t-dim small">rollback · watchdog · /metrics</text>
    <text x="1000" y="600" text-anchor="middle" class="t-dim small">Linux Net · TPROXY opt-in</text>
    <text x="1000" y="624" text-anchor="middle" class="line2 mono small">LAN ─► PROXY ─► WAN</text>
  </g>
  <line x1="200" y1="660" x2="200" y2="700" class="line2 dash"/><line x1="600" y1="660" x2="600" y2="700" class="line2 dash"/><line x1="1000" y1="660" x2="1000" y2="700" class="line2 dash"/>
  <rect x="330" y="692" width="540" height="34" rx="17" fill="#0e2a1a" stroke="#7ee2a8"/><text x="600" y="714" text-anchor="middle" class="t-white small">Telemetry → Prometheus · invariant: cloud loss ≠ LAN loss</text>
</svg>
